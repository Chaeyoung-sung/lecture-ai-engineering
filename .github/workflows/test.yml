name: ML Pipeline CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest great_expectations pandas scikit-learn flake8 black mypy pytest-cov psutil
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Lint with flake8
      run: |
        flake8 day5/演習3 --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 day5/演習3 --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics
        
    # Blackのフォーマットチェックをスキップし、実際のテストに集中
    # - name: Format check with black
    #   run: |
    #     black --check day5/演習3
        
    - name: Run data tests
      run: |
        pytest day5/演習3/tests/test_data.py -v
        
    - name: Run model tests
      run: |
        # タイトルを表示して見やすく
        echo "==== 基本モデルテスト ===="
        pytest day5/演習3/tests/test_model.py::test_model_exists -v
        pytest day5/演習3/tests/test_model.py::test_model_accuracy -v
        pytest day5/演習3/tests/test_model.py::test_model_inference_time -v
        pytest day5/演習3/tests/test_model.py::test_model_reproducibility -v
        
        echo "==== 総合評価指標テスト ===="
        pytest day5/演習3/tests/test_model.py::test_model_comprehensive_metrics -v
        
        echo "==== 過去モデルとの比較テスト ===="
        pytest day5/演習3/tests/test_model.py::test_compare_with_previous_model -v
        
        echo "==== モデル特性分析テスト ===="
        pytest day5/演習3/tests/test_model.py::test_model_feature_importance -v
        pytest day5/演習3/tests/test_model.py::test_model_drift_detection -v
        
        echo "==== モデル技術的検証テスト ===="
        pytest day5/演習3/tests/test_model.py::test_model_serialization_format -v
        pytest day5/演習3/tests/test_model.py::test_model_resource_usage -v
        pytest day5/演習3/tests/test_model.py::test_prediction_consistency -v
        
        # カバレッジレポート生成
        echo "==== テストカバレッジレポート ===="
        pytest day5/演習3/tests/test_model.py --cov=day5/演習3 --cov-report=term-missing